<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#638eb3"><title>Sky — a little time outside</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='13' fill='%23edc796'/%3E%3C/svg%3E"></head>
<body><canvas id="sky" aria-label="Interactive sky. Drag left or right to change the time." tabindex="0"></canvas>
<header><a class="wordmark" href="./">sky<span>a little time in Benicia</span></a><button id="settings-toggle" aria-expanded="false" aria-controls="settings">Atmosphere <span>＋</span></button></header>
<aside id="settings" hidden><label>View <select id="scene" aria-label="View"><option value="landscape">Panorama</option><option value="sky">Open sky</option></select></label><label>Cloud cover <output id="cover-value">55%</output><input id="cover" aria-label="Cloud cover" type="range" min="0" max="1" step="0.01" value="0.55"></label><label>Wind <output id="wind-value">Gentle</output><input id="wind" aria-label="Wind" type="range" min="0" max="2" step="0.01" value="0.5"></label><label>Detail <select id="quality"><option value="balanced">Balanced</option><option value="high">High</option><option value="low">Light</option></select></label></aside>
<div id="error" role="alert" hidden></div>
<footer><div class="moment"><div class="time-line"><time id="clock">4:30 <small>pm</small></time><button id="play" aria-label="Pause time" title="Pause time">Ⅱ</button></div><p id="period">The afternoon, unhurried.</p></div><div class="instructions"><span>← &nbsp; Drag to wander through the day &nbsp; →</span><span class="keyboard-hint">Scroll, or use the arrow keys</span></div><div class="presets" aria-label="Time of day"><button data-hour="6.3">Dawn</button><button data-hour="12">Day</button><button data-hour="18.2">Dusk</button><button data-hour="0">Night</button></div></footer>
<div class="timeline"><input id="time" aria-label="Time of day" type="range" min="0" max="24" step="0.01" value="16.5"></div>
<script type="module" src="/src/main.js"></script></body></html>
